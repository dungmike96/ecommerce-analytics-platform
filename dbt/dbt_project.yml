name: 'ecommerce_dwh'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_dwh'

model-paths: ["models"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_dwh:

    # Layer 2 - Staging
    staging:
      +materialized: view
      +schema: staging

    # Layer 3 - Intermediate
    intermediate:
      +materialized: view
      +schema: intermediate

    # Layer 4 - Core Data Warehouse
    warehouse:
      +materialized: table
      +schema: data_schema

    # Layer 5 - Analytics / BI
    analytics:
      +materialized: table
      +schema: analytics