version: 2

models:
  - name: ga4_acquisition_daily
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: sessions
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_date, session_source, session_medium, session_campaign_name]

  - name: ga4_landing_page_daily
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: landing_page
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_date, landing_page, session_source, session_medium]

  - name: ga4_events_daily
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: event_name
        data_tests: [not_null]
      - name: event_count
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [property_id, stream_id, report_date, event_name, session_source, session_medium]